name: deploy

on:
  push:
    branches: [wireframe, stage, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  image:
    name: build, push, deploy
    needs: check
    runs-on: ubuntu-latest
    # branch main deploys to the prod environment, the others to the environment of the same name
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    permissions:
      contents: read
      packages: write
    env:
      RENDER_MODE: ${{ vars.RENDER_MODE || 'static' }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_ENV: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick the Dockerfile
        id: mode
        run: |
          case "$RENDER_MODE" in
            static) dockerfile=Dockerfile ;;
            ssr) dockerfile=Dockerfile.ssr ;;
            *) echo "::error::RENDER_MODE must be static or ssr, got '$RENDER_MODE'"; exit 1 ;;
          esac
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          if [ -z "$SITE_URL" ]; then
            echo "::warning::SITE_URL is not set for this environment, the build uses https://example.com"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.mode.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_SITE_URL=${{ env.SITE_URL || 'https://example.com' }}
            NUXT_SITE_ENV=${{ env.SITE_ENV }}
          cache-from: type=gha,scope=${{ env.RENDER_MODE }}
          cache-to: type=gha,mode=max,scope=${{ env.RENDER_MODE }}

      - name: Call the Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::COOLIFY_WEBHOOK_URL or COOLIFY_TOKEN is not set for this environment, skipping the deploy call"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
          echo
