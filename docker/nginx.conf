server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # hashed build assets never change
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # prerendered pages first, then the spa fallback for client-side routes
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html /200.html;
    }

    error_page 404 /404.html;
}
